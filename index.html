<!doctype html>
<html lang="en" class="min-h-screen h-auto overflow-y-auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pulse - Mobile Social Media</title>
    <meta name="description" content="Mobile-first social media app for reels, stories, live rooms, rewards coins, and payment wallet with JazzCash, Easypaisa, PayPal, and Skrill support." />
    
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Pulse" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pulse" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="Pulse - Mobile Social Media" />
    <meta property="og:description" content="Mobile-first social media app for reels, stories, live rooms, rewards coins, and payment wallet with JazzCash, Easypaisa, PayPal, and Skrill support." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@400..800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-rose-500 selection:text-white min-h-screen h-auto overflow-y-auto">
    <div id="root" class="min-h-screen h-auto overflow-y-auto"></div>

    <!-- Service Worker Registration Script (Production Only) -->
    <script>
      if ('serviceWorker' in navigator) {
        const isDev = window.location.hostname.includes('localhost') || 
                      window.location.hostname.includes('run.app') || 
                      window.location.port === '3000';
        if (isDev) {
          // In development preview, automatically unregister any stale service workers to prevent React chunk collisions
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const r of registrations) {
              r.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then((keys) => {
              for (const k of keys) {
                if (k.startsWith('pulse-')) caches.delete(k);
              }
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker
              .register('/service-worker.js', { scope: '/' })
              .catch((error) => {
                console.warn('[PWA] ServiceWorker registration notice:', error);
              });
          });
        }
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
