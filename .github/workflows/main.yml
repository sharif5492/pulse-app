name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Application Production Build
        run: npm run build

      - name: Setup Java Environment (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Fully Integrated Android Framework
        run: |
          npm install @capacitor/android@latest --save-dev
          npx cap add android || true
          npx cap sync android

      - name: Grant Gradle Executive Permissions
        run: chmod +x android/gradlew

      - name: Build Pure Standalone Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Output Generated Pulse APK File
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Real-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
