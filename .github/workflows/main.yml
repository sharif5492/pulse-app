name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Application Production Build
        run: npm run build

      - name: Generate Lightweight Mobile Distribution Bundle
        run: |
          mkdir -p android-dist/www
          cp -r dist/* android-dist/www/
          cd android-dist
          zip -r ../Pulse-Mobile-App.zip ./*

      - name: Output Generated Pulse Mobile Package
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Mobile-App
          path: Pulse-Mobile-App.zip
